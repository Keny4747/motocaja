name: motocaja
description: Control diario de ingresos y gastos para motociclistas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  path: ^1.9.1
  pdf: ^3.13.0
  printing: ^5.15.0
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/motocaja.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/motocaja.png"
  min_sdk_android: 23